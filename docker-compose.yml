name: brain-tumor-federated

# 1 Flower server + 3 hospitals (federated clients) + the Gradio web app,
# all on the shared bridge network fl_network.
# Start everything:  docker compose up --build
# The MRI images must be in ./data/raw (see README.md, section Docker).

x-hospital: &hospital
  build:
    context: .
    dockerfile: docker/Dockerfile.client
  image: brain-tumor-federated-client
  networks:
    - fl_network
  volumes:
    - ./data/raw:/app/data/raw:ro
  # Hospitals wait until the server accepts connections.
  depends_on:
    server:
      condition: service_healthy
  restart: on-failure:3

services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    image: brain-tumor-federated-server
    environment:
      SERVER_ADDRESS: 0.0.0.0:8080
    ports:
      - "8080:8080"
    networks:
      - fl_network

  hospital_1:
    <<: *hospital
    environment:
      CLIENT_ID: "1"
      SERVER_ADDRESS: server:8080

  hospital_2:
    <<: *hospital
    environment:
      CLIENT_ID: "2"
      SERVER_ADDRESS: server:8080

  hospital_3:
    <<: *hospital
    environment:
      CLIENT_ID: "3"
      SERVER_ADDRESS: server:8080

  # Gradio web app. Needs the app/ folder (app/app.py) and a trained model in
  # model/saved_models/ (mounted read-only).
  webapp:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    image: brain-tumor-federated-app
    ports:
      - "7860:7860"
    volumes:
      - ./model/saved_models:/app/model/saved_models:ro
    networks:
      - fl_network

networks:
  fl_network:
    driver: bridge
