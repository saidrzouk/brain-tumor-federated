name: brain-tumor-federated

# One Flower server + three clients (one per hospital).
# Start everything:  docker compose up --build
# The MRI images must be in ./data/raw (see docker/README.md).

x-client: &client
  build:
    context: .
    dockerfile: docker/Dockerfile.client
  image: brain-tumor-federated-client
  volumes:
    - ./data/raw:/app/data/raw:ro
  depends_on:
    server:
      condition: service_healthy
  restart: on-failure:3

services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    image: brain-tumor-federated-server
    environment:
      SERVER_ADDRESS: 0.0.0.0:8080
    ports:
      - "8080:8080"

  client1:
    <<: *client
    environment:
      CLIENT_ID: "1"
      SERVER_ADDRESS: server:8080

  client2:
    <<: *client
    environment:
      CLIENT_ID: "2"
      SERVER_ADDRESS: server:8080

  client3:
    <<: *client
    environment:
      CLIENT_ID: "3"
      SERVER_ADDRESS: server:8080

  # Optional Gradio app, not started by default.
  # Run with:  docker compose --profile app up --build app
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    image: brain-tumor-federated-app
    ports:
      - "7860:7860"
    volumes:
      - ./model/saved_models:/app/model/saved_models:ro
